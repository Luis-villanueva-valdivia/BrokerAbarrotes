<text x="58" y="716.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#000">Nivel 1: cliente, broker y proveedores viven en el mismo proceso.</text><text x="58" y="730.1" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#000">• ClienteApp nunca conoce a los proveedores: solo llama a Broker.enviar(Solicitud).</text><text x="58" y="743.9" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#000">• Broker busca el proveedor en RegistroServicios por el nombre del servicio.</text><text x="58" y="757.6" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#000">• Cualquier RuntimeException del proveedor se convierte en Respuesta ERROR_PROVEEDOR.</text><text x="58" y="771.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#000">• Puertos: pEnviar (provee), pProveedor (requiere ProveedorServicio), pServicio (provee).</text></svg>
