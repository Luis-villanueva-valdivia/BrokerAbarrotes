<text x="98" y="1070.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#000">ProveedorRemoto.ejecutar repite el bloque hasta MAX_REINTENTOS = 2 veces: 3 intentos × 2000 ms ≈ 6 s.</text><text x="98" y="1083.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#000">SocketTimeoutException → EstadoRespuesta.TIMEOUT; cualquier otra IOException (p. ej. NodoProveedores apagado) → ERROR_PROVEEDOR.</text><text x="98" y="1095.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#000">El broker no se cae: responde al cliente y sigue atendiendo otras conexiones en sus hilos.</text><text x="98" y="1108.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#000">El ClienteRemoto espera hasta 10000 ms (TIEMPO_LECTURA_MS), así que sí alcanza a recibir la respuesta TIMEOUT.</text></svg>
